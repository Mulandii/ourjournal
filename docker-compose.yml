# Little Journal — PocketBase + Caddy (automatic HTTPS). Start with: docker compose up -d
# Settings come from .env (copy .env.example). If your server already runs Traefik, use
# docker-compose.traefik.yml instead (put COMPOSE_FILE=docker-compose.traefik.yml in .env).
services:
  pocketbase:
    build: .
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
      - JOURNAL_SETUP_CODE=${JOURNAL_SETUP_CODE:-}
    volumes:
      - ./pb_data:/pb_data                 # database, photos, videos, nightly backups
      - ./pb_public:/pb_public:ro          # the journal website
      - ./pb_migrations:/pb_migrations:ro  # schema + access rules
      - ./pb_hooks:/pb_hooks:ro            # setup, cleanup

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    depends_on: [pocketbase]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - JOURNAL_HOST=${JOURNAL_HOST:?set JOURNAL_HOST in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
